<svg xmlns="http://www.w3.org/2000/svg" width="724" height="350" viewBox="0 0 724 350" role="img" aria-labelledby="title desc">
  <title id="title">Frostfire25&apos;s most-used repository languages</title>
  <desc id="desc">JavaScript 62.1%, HTML 27.1%, G-code 9.5%, Java 0.6%, CSS 0.2%. Based on 25 original public repositories.</desc>
  <defs>
    <linearGradient id="languages-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161329"/>
    </linearGradient>
    <clipPath id="language-bar">
      <rect x="36" y="103" width="652" height="16" rx="8"/>
    </clipPath>
  </defs>
  <rect width="724" height="350" rx="22" fill="url(#languages-background)"/>
  <rect x="1" y="1" width="722" height="348" rx="21" fill="none" stroke="#30363d"/>
  <text x="36" y="50" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Languages I use</text>
  <text x="36" y="77" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Across 25 original public repositories</text>
  <rect x="36" y="103" width="652" height="16" rx="8" fill="#21262d"/>
  <g clip-path="url(#language-bar)">
    <rect x="36.00" y="103" width="405.13" height="16" fill="#F1E05A"/>
    <rect x="441.13" y="103" width="176.44" height="16" fill="#E34C26"/>
    <rect x="617.57" y="103" width="61.89" height="16" fill="hsl(227 62% 58%)"/>
    <rect x="679.46" y="103" width="4.00" height="16" fill="#B07219"/>
    <rect x="683.46" y="103" width="1.28" height="16" fill="#663399"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <circle cx="44" cy="153" r="6" fill="#F1E05A"/>
    <text x="60" y="158" fill="#c9d1d9" font-size="14" font-weight="600">JavaScript</text>
    <text x="676" y="158" fill="#8b949e" font-size="14" text-anchor="end">62.1%</text>
    <circle cx="44" cy="188" r="6" fill="#E34C26"/>
    <text x="60" y="193" fill="#c9d1d9" font-size="14" font-weight="600">HTML</text>
    <text x="676" y="193" fill="#8b949e" font-size="14" text-anchor="end">27.1%</text>
    <circle cx="44" cy="223" r="6" fill="hsl(227 62% 58%)"/>
    <text x="60" y="228" fill="#c9d1d9" font-size="14" font-weight="600">G-code</text>
    <text x="676" y="228" fill="#8b949e" font-size="14" text-anchor="end">9.5%</text>
    <circle cx="44" cy="258" r="6" fill="#B07219"/>
    <text x="60" y="263" fill="#c9d1d9" font-size="14" font-weight="600">Java</text>
    <text x="676" y="263" fill="#8b949e" font-size="14" text-anchor="end">0.6%</text>
    <circle cx="44" cy="293" r="6" fill="#663399"/>
    <text x="60" y="298" fill="#c9d1d9" font-size="14" font-weight="600">CSS</text>
    <text x="676" y="298" fill="#8b949e" font-size="14" text-anchor="end">0.2%</text>
  </g>
</svg>
