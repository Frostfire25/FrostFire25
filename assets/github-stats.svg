<svg xmlns="http://www.w3.org/2000/svg" width="724" height="250" viewBox="0 0 724 250" role="img" aria-labelledby="title desc">
  <title id="title">Frostfire25&apos;s GitHub statistics</title>
  <desc id="desc">30 public repositories, 3 stars earned, 1 fork, and 29 followers.</desc>
  <defs>
    <linearGradient id="stats-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="stats-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>
  <rect width="724" height="250" rx="22" fill="url(#stats-background)"/>
  <rect x="1" y="1" width="722" height="248" rx="21" fill="none" stroke="#30363d"/>
  <rect x="36" y="34" width="48" height="5" rx="2.5" fill="url(#stats-accent)"/>
  <text x="36" y="72" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">GitHub at a glance</text>
  <text x="36" y="99" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Frostfire25&apos;s public profile</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">

    <g transform="translate(36 122)">
      <rect width="154" height="92" rx="16" fill="#161b22" stroke="#30363d"/>
      <text x="18" y="39" fill="#f0f6fc" font-size="25" font-weight="700">30</text>
      <text x="18" y="67" fill="#8b949e" font-size="13">Public repositories</text>
    </g>
    <g transform="translate(202 122)">
      <rect width="154" height="92" rx="16" fill="#161b22" stroke="#30363d"/>
      <text x="18" y="39" fill="#f0f6fc" font-size="25" font-weight="700">3</text>
      <text x="18" y="67" fill="#8b949e" font-size="13">Stars earned</text>
    </g>
    <g transform="translate(368 122)">
      <rect width="154" height="92" rx="16" fill="#161b22" stroke="#30363d"/>
      <text x="18" y="39" fill="#f0f6fc" font-size="25" font-weight="700">1</text>
      <text x="18" y="67" fill="#8b949e" font-size="13">Repository forks</text>
    </g>
    <g transform="translate(534 122)">
      <rect width="154" height="92" rx="16" fill="#161b22" stroke="#30363d"/>
      <text x="18" y="39" fill="#f0f6fc" font-size="25" font-weight="700">29</text>
      <text x="18" y="67" fill="#8b949e" font-size="13">Followers</text>
    </g>
  </g>
</svg>
